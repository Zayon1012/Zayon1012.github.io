name: Build image & font assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'greenlight/tools/**'
      - '.github/workflows/assets.yml'

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Generate manifest, WebP images and fonts
        working-directory: greenlight
        run: |
          [ -f tools/image_manifest.json ] || python tools/make_manifest.py
          python tools/build_images.py
          python tools/fetch_fonts.py
          ls img | wc -l
          ls -la fonts
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenlight/img greenlight/fonts greenlight/tools/image_manifest.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build WebP images and fonts [bot]"
          git pull --rebase origin main
          git push origin HEAD:main
